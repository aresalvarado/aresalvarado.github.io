<script>
let DATA = { generated_at: "", items: [] };

function uniq(arr){ return [...new Set(arr)].sort(); }

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const cat = document.getElementById("cat").value;
  const src = document.getElementById("src").value;

  const items = (DATA.items || []).filter(it => {
    if (cat !== "all" && it.category !== cat) return false;
    if (src !== "all" && it.source !== src) return false;
    if (q && !(it.title || "").toLowerCase().includes(q)) return false;
    return true;
  });

  const list = document.getElementById("list");
  list.innerHTML = items.map(it => `
    <div class="item">
      <div class="top">
        <div>
          <a href="${it.link}" target="_blank" rel="noopener noreferrer">
            ${escapeHtml(it.title)}
          </a>
        </div>
      </div>
      <div class="chips">
        <span class="chip">${escapeHtml(it.category)}</span>
        <span class="chip">${escapeHtml(it.source)}</span>
        <span class="chip">${escapeHtml(it.published || "")}</span>
      </div>
      ${it.summary ? `<div class="small" style="margin-top:8px;">${escapeHtml(it.summary)}</div>` : ""}
    </div>
  `).join("") || `<div class="small">No matches.</div>`;

  document.getElementById("meta").textContent =
    `Updated: ${DATA.generated_at} • Showing ${items.length} items`;
}

const WORKER = "https://rss-proxy.aresronaldoalvarado.workers.dev/";

const FEEDS = [
  { category:"Cyber", source:"BleepingComputer", url:"https://www.bleepingcomputer.com/feed/" },
  { category:"Cyber", source:"The Hacker News", url:"https://feeds.feedburner.com/TheHackersNews" },
  { category:"Cyber", source:"KrebsOnSecurity", url:"https://krebsonsecurity.com/feed/" },
  { category:"Tech", source:"Apple Newsroom", url:"https://www.apple.com/newsroom/rss-feed.rss" },
  { category:"Tech", source:"NVIDIA Blog", url:"https://blogs.nvidia.com/blog/feed/" },
  { category:"Tech", source:"Google Blog", url:"https://blog.google/rss/" },
  { category:"Tech", source:"Netflix TechBlog", url:"https://netflixtechblog.com/feed" },
];

// Fetch JSON from the Worker
async function fetchFeedJson(feedUrl) {
  const res = await fetch(`${WORKER}/feed?url=${encodeURIComponent(feedUrl)}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`Worker fetch failed ${res.status} for ${feedUrl}`);
  const data = await res.json();
  if (!data.ok) throw new Error(`Worker returned error for ${feedUrl}: ${data.error || "unknown"}`);
  return data; // { ok, title, items, fetched_at, ... }
}

async function init() {
  document.getElementById("meta").textContent = "Loading feeds…";

  const results = await Promise.all(
    FEEDS.map(async (f) => {
      const data = await fetchFeedJson(f.url);
      const items = (data.items || []).map(it => ({
        title: it.title || "",
        link: it.link || "",
        published: it.published || "",
        summary: it.summary || "",
        category: f.category,
        source: f.source
      }));
      return { fetched_at: data.fetched_at, items };
    })
  );

  const merged = results.flatMap(r => r.items);
  merged.sort((a, b) => (b.published || "").localeCompare(a.published || ""));

  const newestFetched = results.map(r => r.fetched_at).sort().slice(-1)[0] || new Date().toISOString();

  DATA = {
    generated_at: newestFetched,
    items: merged
  };

  const cats = uniq(DATA.items.map(i => i.category));
  const srcs = uniq(DATA.items.map(i => i.source));

  const catSel = document.getElementById("cat");
  catSel.innerHTML = `<option value="all">All categories</option>`;
  cats.forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });

  const srcSel = document.getElementById("src");
  srcSel.innerHTML = `<option value="all">All sources</option>`;
  srcs.forEach(s => {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    srcSel.appendChild(o);
  });

  ["q","cat","src"].forEach(id => document.getElementById(id).addEventListener("input", render));
  ["cat","src"].forEach(id => document.getElementById(id).addEventListener("change", render));

  render();
}
