<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybersecurity News Reader</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --chip:#21262d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fa; --panel:#fff; --border:#d0d7de;
           --fg:#1f2328; --muted:#656d76; --accent:#0969da; --chip:#eaeef2; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:24px 16px 8px;max-width:900px;margin:0 auto}
  h1{margin:0 0 4px;font-size:22px}
  main{max-width:900px;margin:0 auto;padding:0 16px 48px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  input,select{background:var(--panel);color:var(--fg);border:1px solid var(--border);
               border-radius:6px;padding:8px 10px;font:inherit}
  input{flex:1;min-width:200px}
  .small{color:var(--muted);font-size:13px}
  .item{background:var(--panel);border:1px solid var(--border);border-radius:8px;
        padding:14px 16px;margin-bottom:10px}
  .item a{color:var(--accent);text-decoration:none;font-weight:600}
  .item a:hover{text-decoration:underline}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;
        padding:2px 10px;font-size:12px;color:var(--muted)}
  .err{border-color:#f85149}
</style>
</head>
<body>
<header>
  <h1>Cybersecurity News</h1>
  <div class="small" id="meta">Loading…</div>
</header>
<main>
  <div class="controls">
    <input id="q" type="search" placeholder="Search headlines…" autocomplete="off">
    <select id="cat"><option value="all">All categories</option></select>
    <select id="src"><option value="all">All sources</option></select>
  </div>
  <div id="list"></div>
</main>

<script>
let DATA = { generated_at: "", items: [] };

function uniq(arr){ return [...new Set(arr)].sort(); }

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function fmtDate(s){
  const d = new Date(s);
  return isNaN(d) ? (s || "") : d.toLocaleString(undefined,
    { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const cat = document.getElementById("cat").value;
  const src = document.getElementById("src").value;

  const items = (DATA.items || []).filter(it => {
    if (cat !== "all" && it.category !== cat) return false;
    if (src !== "all" && it.source !== src) return false;
    if (q && !((it.title || "") + " " + (it.summary || "")).toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("list").innerHTML = items.map(it => `
    <div class="item">
      <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title)}</a>
      <div class="chips">
        <span class="chip">${escapeHtml(it.category)}</span>
        <span class="chip">${escapeHtml(it.source)}</span>
        <span class="chip">${escapeHtml(fmtDate(it.published))}</span>
      </div>
      ${it.summary ? `<div class="small" style="margin-top:8px;">${escapeHtml(it.summary)}</div>` : ""}
    </div>
  `).join("") || `<div class="small">No matches.</div>`;

  document.getElementById("meta").textContent =
    `Updated ${fmtDate(DATA.generated_at)} • Showing ${items.length} of ${DATA.items.length} items`;
}

// No trailing slash — it gets joined with "/feed".
const WORKER = "https://rss-proxy.aresronaldoalvarado.workers.dev";

const FEEDS = [
  { category:"Cyber", source:"BleepingComputer",  url:"https://www.bleepingcomputer.com/feed/" },
  { category:"Cyber", source:"The Hacker News",   url:"https://feeds.feedburner.com/TheHackersNews" },
  { category:"Cyber", source:"KrebsOnSecurity",   url:"https://krebsonsecurity.com/feed/" },
  { category:"Cyber", source:"Dark Reading",      url:"https://www.darkreading.com/rss.xml" },
  { category:"Cyber", source:"SecurityWeek",      url:"https://www.securityweek.com/feed/" },
  { category:"Cyber", source:"Schneier on Security", url:"https://www.schneier.com/feed/atom/" },
  { category:"Cyber", source:"CISA Advisories",   url:"https://www.cisa.gov/cybersecurity-advisories/all.xml" },
  { category:"Tech",  source:"Apple Newsroom",    url:"https://www.apple.com/newsroom/rss-feed.rss" },
  { category:"Tech",  source:"NVIDIA Blog",       url:"https://blogs.nvidia.com/blog/feed/" },
  { category:"Tech",  source:"Google Blog",       url:"https://blog.google/rss/" },
  { category:"Tech",  source:"Netflix TechBlog",  url:"https://netflixtechblog.com/feed" },
];

async function fetchFeedJson(feedUrl) {
  const res = await fetch(`${WORKER}/feed?url=${encodeURIComponent(feedUrl)}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`worker HTTP ${res.status}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "worker error");
  if (data.parse_error) throw new Error(data.parse_error);
  return data;
}

function fillSelect(id, values, allLabel) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="all">${allLabel}</option>`;
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

async function init() {
  document.getElementById("meta").textContent = "Loading feeds…";

  // One bad feed must not blank the whole page.
  const results = await Promise.allSettled(FEEDS.map(async f => {
    const data = await fetchFeedJson(f.url);
    return {
      fetched_at: data.fetched_at,
      items: (data.items || []).map(it => ({
        title: it.title || "(untitled)",
        link: it.link || "",
        published: it.published || "",
        summary: it.summary || "",
        category: f.category,
        source: f.source
      }))
    };
  }));

  const ok = [], failed = [];
  results.forEach((r, i) => r.status === "fulfilled" ? ok.push(r.value)
                                                     : failed.push(`${FEEDS[i].source}: ${r.reason.message}`));

  DATA = {
    generated_at: ok.map(r => r.fetched_at).filter(Boolean).sort().pop() || new Date().toISOString(),
    items: ok.flatMap(r => r.items)
             .sort((a, b) => (Date.parse(b.published) || 0) - (Date.parse(a.published) || 0))
  };

  fillSelect("cat", uniq(DATA.items.map(i => i.category)), "All categories");
  fillSelect("src", uniq(DATA.items.map(i => i.source)), "All sources");

  // Default to the cybersecurity view.
  const cat = document.getElementById("cat");
  if ([...cat.options].some(o => o.value === "Cyber")) cat.value = "Cyber";

  ["q"].forEach(id => document.getElementById(id).addEventListener("input", render));
  ["cat","src"].forEach(id => document.getElementById(id).addEventListener("change", render));

  render();

  if (failed.length) {
    document.getElementById("list").insertAdjacentHTML("afterbegin",
      `<div class="item err"><b>${failed.length} feed(s) failed</b>
       <div class="small" style="margin-top:6px;">${escapeHtml(failed.join(" • "))}</div></div>`);
  }
  if (!DATA.items.length) {
    document.getElementById("meta").textContent = "No items loaded — the RSS proxy returned nothing.";
  }
}

init().catch(e => {
  document.getElementById("meta").textContent = "Failed to load: " + e.message;
});
</script>
</body>
</html>
